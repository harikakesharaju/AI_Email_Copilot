<mat-toolbar class="navbar">

  <div class="nav-left">

    <button mat-icon-button [matMenuTriggerFor]="mobileMenu" class="hamburger" aria-label="Open menu">
      <mat-icon>menu</mat-icon>
    </button>

    <a routerLink="/dashboard" class="logo">
      <mat-icon class="logo-icon">smart_toy</mat-icon>
      <span class="logo-text">AI Email Copilot</span>
    </a>

    <nav class="nav-links">
      <a routerLink="/dashboard" routerLinkActive="active">
        <mat-icon>dashboard</mat-icon><span>Dashboard</span>
      </a>
      <a routerLink="/emails" routerLinkActive="active">
        <mat-icon>email</mat-icon><span>Emails</span>
      </a>
      <a routerLink="/tasks" routerLinkActive="active">
        <mat-icon>task_alt</mat-icon><span>Tasks</span>
      </a>
      <a routerLink="/drafts" routerLinkActive="active">
        <mat-icon>edit_note</mat-icon><span>Drafts</span>
      </a>
      <a routerLink="/settings" routerLinkActive="active">
        <mat-icon>settings</mat-icon><span>Settings</span>
      </a>
    </nav>

  </div>

  <button mat-icon-button [matMenuTriggerFor]="profileMenu" class="profile-btn" aria-label="Account menu">
    <mat-icon>account_circle</mat-icon>
  </button>

</mat-toolbar>

<!-- Profile dropdown -->
<mat-menu #profileMenu="matMenu" xPosition="before">
  <div class="profile-header" *ngIf="user" (click)="$event.stopPropagation()">
    <mat-icon class="profile-avatar">account_circle</mat-icon>
    <div class="profile-info">
      <span class="profile-label">Signed in as</span>
      <span class="profile-email">{{ user.email }}</span>
    </div>
  </div>
  <mat-divider *ngIf="user"></mat-divider>
  <button mat-menu-item routerLink="/settings">
    <mat-icon>settings</mat-icon><span>Settings</span>
  </button>
  <button mat-menu-item (click)="logout()" class="logout-item">
    <mat-icon>logout</mat-icon><span>Sign out</span>
  </button>
</mat-menu>

<!-- Mobile slide-out menu -->
<mat-menu #mobileMenu="matMenu">
  <button mat-menu-item routerLink="/dashboard">
    <mat-icon>dashboard</mat-icon><span>Dashboard</span>
  </button>
  <button mat-menu-item routerLink="/emails">
    <mat-icon>email</mat-icon><span>Emails</span>
  </button>
  <button mat-menu-item routerLink="/tasks">
    <mat-icon>task_alt</mat-icon><span>Tasks</span>
  </button>
  <button mat-menu-item routerLink="/drafts">
    <mat-icon>edit_note</mat-icon><span>Drafts</span>
  </button>
  <button mat-menu-item routerLink="/settings">
    <mat-icon>settings</mat-icon><span>Settings</span>
  </button>
  <mat-divider></mat-divider>
  <button mat-menu-item (click)="logout()">
    <mat-icon>logout</mat-icon><span>Sign out</span>
  </button>
</mat-menu>
