<mat-toolbar class="navbar">

  <div class="left-section">

    <button
      mat-icon-button
      class="menu-button"
      [matMenuTriggerFor]="mobileMenu">

      <mat-icon>menu</mat-icon>

    </button>

    <div class="logo">
      🤖 AI Email Copilot
    </div>

    <nav class="nav-links">

      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>

      <a routerLink="/emails" routerLinkActive="active">Emails</a>

      <a routerLink="/tasks" routerLinkActive="active">Tasks</a>

      <a routerLink="/drafts" routerLinkActive="active">Drafts</a>

      <a routerLink="/settings" routerLinkActive="active">Settings</a>

    </nav>

  </div>

  <div class="profile-container">
    <button mat-icon-button (click)="toggleMenu($event)">
      <mat-icon>account_circle</mat-icon>
    </button>
    <div class="profile-menu" *ngIf="menuOpen">
      <div class="profile-email" *ngIf="user; else notSignedIn">{{ user.email }}</div>
      <ng-template #notSignedIn>
        <a routerLink="/login" class="profile-link">Login</a>
      </ng-template>
      <div class="profile-actions">
        <button mat-button (click)="logout()">Logout</button>
      </div>
    </div>
  </div>

</mat-toolbar>

<mat-menu #mobileMenu="matMenu">

  <button mat-menu-item routerLink="/dashboard">Dashboard</button>
  <button mat-menu-item routerLink="/emails">Emails</button>
  <button mat-menu-item routerLink="/tasks">Tasks</button>
  <button mat-menu-item routerLink="/drafts">Drafts</button>
  <button mat-menu-item routerLink="/settings">Settings</button>

</mat-menu>
