<h1 class="page-title">

    Emails

</h1>

<mat-form-field appearance="outline" class="search-box">

    <mat-label>Search emails</mat-label>

    <input
        matInput
        placeholder="Search sender or summary..."
        [(ngModel)]="searchText">

</mat-form-field>
<mat-card>

<table mat-table [dataSource]="emails()">

    <!-- Sender -->

    <ng-container matColumnDef="sender">

        <th mat-header-cell *matHeaderCellDef>

            Sender

        </th>

        <td mat-cell *matCellDef="let email">

{{ getSenderName(email.sender) }}
        </td>

    </ng-container>

    <!-- Summary -->

    <ng-container matColumnDef="summary">

        <th mat-header-cell *matHeaderCellDef>

            Summary

        </th>

        <td mat-cell *matCellDef="let email">

            {{email.summary}}

        </td>

    </ng-container>

    <!-- Category -->

    <ng-container matColumnDef="category">

        <th mat-header-cell *matHeaderCellDef>

            Category

        </th>

        <td mat-cell *matCellDef="let email">

            {{email.category}}

        </td>

    </ng-container>

    <!-- Priority -->

    <ng-container matColumnDef="priority">

        <th mat-header-cell *matHeaderCellDef>

            Priority

        </th>

        <td mat-cell *matCellDef="let email">

        <mat-chip
            [ngClass]="{
            'high-chip': email.priority === 'HIGH',
            'medium-chip': email.priority === 'MEDIUM',
            'low-chip': email.priority === 'LOW'
            }">

            {{email.priority}}

        </mat-chip>
        </td>

    </ng-container>
    <ng-container matColumnDef="confidence">

    <th mat-header-cell *matHeaderCellDef>
        Confidence
    </th>

    <td mat-cell *matCellDef="let email">
        {{ email.confidence | percent:'1.0-0' }}
    </td>

</ng-container>

       <ng-container matColumnDef="needs_manual_review">

    <th mat-header-cell *matHeaderCellDef>
        Review
    </th>

    <td mat-cell *matCellDef="let email">

        <span *ngIf="email.needs_manual_review">
            ⚠ Needs Review
        </span>

        <span *ngIf="!email.needs_manual_review">
            ✅ Auto
        </span>

    </td>

</ng-container>
    <!-- Date -->

    <ng-container matColumnDef="received_at">

        <th mat-header-cell *matHeaderCellDef>

            Received

        </th>

        <td mat-cell *matCellDef="let email">

            {{email.received_at | date:'medium'}}

        </td>

    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

    <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns;">
    </tr>

</table>

</mat-card>
